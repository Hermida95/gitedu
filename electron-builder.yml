appId: com.gitedu.app
productName: GitEdu
directories:
  output: release
  buildResources: build

# Usado por `electron-builder --publish always` en el workflow de release: sube
# el instalador de cada plataforma como asset del tag que disparó el build,
# sin tocar nada si se ejecuta localmente sin --publish.
publish:
  provider: github
  owner: Hermida95
  repo: gitedu

files:
  - out/**/*
  - package.json

mac:
  category: public.app-category.developer-tools
  target: dmg
  identity: null

win:
  target: nsis

linux:
  target: AppImage
  category: Development
