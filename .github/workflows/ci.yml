name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Pineadas a un SHA en vez de a la etiqueta @v4: una etiqueta se puede
      # reasignar (ha pasado de verdad con acciones de terceros comprometidas,
      # p.ej. tj-actions/changed-files en 2025); un commit concreto no.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      # No bloquea en low/moderate (a menudo transitivas y sin fix disponible),
      # pero sí falla el build si aparece algo high/critical sin que nadie lo note.
      - run: npm audit --audit-level=high
