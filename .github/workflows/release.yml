name: Release

# Se dispara solo con un tag vX.Y.Z (git tag v0.3.1 && git push --tags).
# Construye el instalador de cada plataforma en su propio runner nativo —
# electron-builder no compila para macOS/Windows/Linux desde una sola
# máquina, cada sistema operativo empaqueta el suyo — y los sube como
# assets de la release de ese tag.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Pineadas a un SHA en vez de a la etiqueta @v4 — ver el mismo comentario en ci.yml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test

      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
